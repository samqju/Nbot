name: V6 prototype smoke

on:
  pull_request:
    paths:
      - 'v6/**'
      - '.github/workflows/v6-prototype.yml'
  push:
    branches:
      - 'prototype/v6-freqtrade-freqai-*'

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s v6/tests -v
      - run: python -m py_compile v6/user_data/strategies/NbotV6.py
      - run: python -m json.tool v6/user_data/config.json > /dev/null

  real-freqtrade-strategy-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import strategy with official FreqAI Docker image (no Binance/API calls)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/v6/user_data:/freqtrade/user_data" \
            freqtradeorg/freqtrade:stable_freqai \
            list-strategies --config /freqtrade/user_data/config.json \
            --strategy-path /freqtrade/user_data/strategies \
            | tee /tmp/nbot-v6-strategies.txt
          grep -E 'NbotV6.*OK' /tmp/nbot-v6-strategies.txt
