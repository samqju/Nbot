name: V7 offline research contracts
on:
  push:
    branches: [V7]
    paths:
      - 'nbot_v7/**'
      - 'nbot/observation/**'
      - 'nbot_v5_1/**'
      - 'tests_v7/**'
      - 'requirements-v7.txt'
      - '.github/workflows/v7-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: -r requirements-v7.txt
      - name: Validate source compilation
        run: python -m compileall -q nbot_v7 nbot/observation nbot_v5_1 tests_v7
      - name: Run offline-only tests
        run: python -m unittest discover -s tests_v7 -v
