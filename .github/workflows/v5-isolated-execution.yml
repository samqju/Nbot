name: V5 isolated execution offline tests
on:
  push:
    branches:
      - 'feature/v5-execution-foundation-*'
    paths:
      - 'nbot/v5/execution_engine.py'
      - 'nbot/v5/execution_replay.py'
      - 'nbot/v5/contest_audit.py'
      - 'tests/test_v5_execution_engine.py'
      - 'tests/test_v5_execution_replay.py'
      - 'tests/test_v5_contest_audit.py'
      - '.github/workflows/v5-isolated-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic-only Execution foundation (no network calls or API keys)
        run: |
          python -m unittest discover -s tests -p 'test_v5_execution*.py' -v
          python -m unittest discover -s tests -p 'test_v5_contest_audit.py' -v
