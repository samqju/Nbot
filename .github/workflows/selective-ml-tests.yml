name: selective-ml-tests

on:
  push:
    branches:
      - main
      - feature/selective-ml-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Learning ML dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ml.txt
      - name: Install V3 WebSocket transport dependency
        run: python -m pip install --disable-pip-version-check -r requirements-wss.txt
      - name: Require V5 roadmap update on V5 pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python deploy/observation/check_v5_roadmap.py --base-sha "$PR_BASE_SHA"
      - name: Prepare clean Execution-role test host
        run: printf 'EXECUTION\n' > .nbot-role
      - name: Run full regression suite (clean progress; diagnostics on failure)
        run: python deploy/observation/run_quiet_regression.py
