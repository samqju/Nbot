name: selective-ml-tests

on:
  push:
    branches:
      - feature/selective-ml-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Learning ML dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ml.txt
      - name: Prepare clean Execution-role test host
        run: printf 'EXECUTION\n' > .nbot-role
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
